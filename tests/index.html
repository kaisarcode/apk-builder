<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>KCAPK Test</title>
    <style>
        :root {
            color-scheme: dark;
            background: #101010;
            color: #f2f2f2;
            font-family: sans-serif;
        }
        body {
            margin: 0;
            padding: 2rem;
            background: #101010;
            color: #f2f2f2;
        }
        button {
            margin: 0 0.5rem 0.5rem 0;
            padding: 0.75rem 1rem;
            border: 1px solid #555;
            border-radius: 0.5rem;
            background: #242424;
            color: #f2f2f2;
        }
        pre {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>KCAPK Test</h1>
    <p>If you can read this, the packaged local WebView app was built successfully.</p>
    <button id="run-exec">Run packaged executable</button>
    <button id="show-toast">Show Android toast</button>
    <button id="check-online">Check Android network state</button>
    <button id="haptic-click">Haptic click</button>
    <button id="clipboard-test">Clipboard round-trip</button>
    <button id="share-test">Open Android Sharesheet</button>
    <button id="screen-on">Keep screen on</button>
    <button id="screen-normal">Release screen</button>
    <pre id="exec-output"></pre>
    <pre id="android-output"></pre>
    <script>
        var androidOutput = document.getElementById("android-output");

        document.getElementById("run-exec").addEventListener("click", function () {
            var output = NativeBridge.exec(["kcapk-test-exec"]);
            document.getElementById("exec-output").textContent = output;
        });
        document.getElementById("show-toast").addEventListener("click", function () {
            NativeBridge.Android.showToast("NativeBridge.Android.showToast works");
        });
        document.getElementById("check-online").addEventListener("click", function () {
            androidOutput.textContent = "Online: " + NativeBridge.Android.isOnline();
        });
        document.getElementById("haptic-click").addEventListener("click", function () {
            androidOutput.textContent = "Haptic: " + NativeBridge.Android.haptics.effect("click");
        });
        document.getElementById("clipboard-test").addEventListener("click", function () {
            NativeBridge.Android.clipboard.set("KCAPK clipboard test");
            androidOutput.textContent = "Clipboard: " + NativeBridge.Android.clipboard.get();
        });
        document.getElementById("share-test").addEventListener("click", function () {
            NativeBridge.Android.intents.share({
                text: "KCAPK NativeBridge.Android.intents.share works",
                chooserTitle: "Share KCAPK test"
            });
        });
        document.getElementById("screen-on").addEventListener("click", function () {
            androidOutput.textContent = "Keep screen on: " + NativeBridge.Android.screen.keepOn(true);
        });
        document.getElementById("screen-normal").addEventListener("click", function () {
            androidOutput.textContent = "Release screen: " + NativeBridge.Android.screen.keepOn(false);
        });
    </script>
</body>
</html>
