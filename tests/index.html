<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>KCAPK Test</title>
    <style>
        :root {
            color-scheme: dark;
            background: #101010;
            color: #f2f2f2;
            font-family: sans-serif;
        }
        body {
            margin: 0;
            padding: 2rem;
            background: #101010;
            color: #f2f2f2;
        }
        button {
            padding: 0.75rem 1rem;
            border: 1px solid #555;
            border-radius: 0.5rem;
            background: #242424;
            color: #f2f2f2;
        }
        pre {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>KCAPK Test</h1>
    <p>If you can read this, the packaged local WebView app was built successfully.</p>
    <button id="run-exec">Run packaged executable</button>
    <pre id="exec-output"></pre>
    <script>
        document.getElementById("run-exec").addEventListener("click", function () {
            var output = NativeBridge.exec(["kcapk-test-exec"]);
            document.getElementById("exec-output").textContent = output;
        });
    </script>
</body>
</html>
