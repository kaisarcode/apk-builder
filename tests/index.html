<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KCAPK Test</title>
</head>
<body>
    <h1>KCAPK Test</h1>
    <p>If you can read this, the packaged local WebView app was built successfully.</p>
    <button id="run-exec" type="button">Run packaged executable</button>
    <pre id="exec-output">Not run yet.</pre>
    <script>
        document.getElementById('run-exec').addEventListener('click', function () {
            var output = document.getElementById('exec-output');

            if (!window.NativeBridge) {
                output.textContent = 'NativeBridge unavailable.';
                return;
            }

            output.textContent = NativeBridge.exec(['kcapk-test-exec', 'hello']);
        });
    </script>
</body>
</html>
